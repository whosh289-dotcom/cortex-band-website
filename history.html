<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Receipts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <h1 class="text-xl font-bold tracking-wide">Receipts</h1>
            <a href="index.html" class="bg-blue-500 px-3 py-1 rounded-md text-sm font-semibold hover:bg-blue-400 transition">Back</a>
        </div>

        <div class="flex-grow p-4 overflow-y-auto pb-24">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Past Orders</h2>
            
            <div class="space-y-4">
                <!-- Mock Receipt 1 -->
                <div class="bg-white border rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2 mb-2 text-sm text-gray-500">
                        <span>Order #0012</span>
                        <span>Today, 2:15 PM</span>
                    </div>
                    <ul class="text-sm space-y-1 text-gray-700 mb-3">
                        <li class="flex justify-between"><span>2x Organic Apple</span> <span>$3.98</span></li>
                        <li class="flex justify-between"><span>1x Almond Milk 1L</span> <span>$3.49</span></li>
                    </ul>
                    <div class="flex justify-between font-bold text-gray-900 border-t pt-2">
                        <span>Total Paid</span>
                        <span>$7.47</span>
                    </div>
                </div>

                <!-- Mock Receipt 2 -->
                <div class="bg-white border rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2 mb-2 text-sm text-gray-500">
                        <span>Order #0011</span>
                        <span>Yesterday, 10:45 AM</span>
                    </div>
                    <ul class="text-sm space-y-1 text-gray-700 mb-3">
                        <li class="flex justify-between"><span>1x Whole Wheat Bread</span> <span>$2.99</span></li>
                    </ul>
                    <div class="flex justify-between font-bold text-gray-900 border-t pt-2">
                        <span>Total Paid</span>
                        <span>$2.99</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-white border-t flex justify-around p-3 text-sm text-gray-500 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <a href="index.html" class="flex flex-col items-center hover:text-blue-600 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="history.html" class="flex flex-col items-center text-blue-600 font-bold transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Receipts
            </a>
            <a href="admin.html" class="flex flex-col items-center hover:text-blue-600 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Admin
            </a>
        </div>
    </div>
</body>
</html>
