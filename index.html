<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Smart Checkout</title>
    <!-- Using Tailwind CSS via CDN for rapid UI prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <!-- Mobile-First App Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-2">
                <!-- Simple SVG icon -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-wide">Cortex Band</h1>
            </div>
            <span class="bg-blue-500 px-2 py-1 rounded-md text-xs font-semibold shadow-inner">Device: #001</span>
        </div>

        <!-- Cart Section -->
        <div class="flex-grow p-4 overflow-y-auto bg-gray-50 pb-24">
            <div class="flex justify-between items-end mb-4 border-b pb-2">
                <h2 class="text-2xl font-bold text-gray-800">Your Cart</h2>
                <span id="item-count" class="text-gray-500 font-medium">0 items</span>
            </div>

            <!-- Cart Items Container -->
            <div id="cart-items" class="space-y-3">
                <!-- Placeholder when empty -->
                <div class="text-center text-gray-400 py-16 flex flex-col items-center">
                    <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <p class="text-lg font-medium">Your cart is empty</p>
                    <p class="text-sm mt-1">Scan an item with your band to add it.</p>
                </div>
            </div>
        </div>

        <!-- Total and Checkout (Sticky Bottom) -->
        <div class="absolute bottom-0 w-full border-t border-gray-200 bg-white p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <div class="flex justify-between items-center mb-4 text-2xl font-black text-gray-800">
                <span>Total</span>
                <span id="cart-total" class="text-blue-600">$0.00</span>
            </div>
            <button id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Pay & Checkout
            </button>
        </div>
    </div>

    <!-- QR Code / Checkout Modal (Hidden by default) -->
    <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl transform scale-100 transition-transform">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Scan to Pay</h3>
            <p class="text-gray-500 text-sm mb-6">Use your phone's camera or a payment app to complete the purchase.</p>
            
            <!-- Mock QR Code -->
            <div class="bg-gray-100 p-4 rounded-lg inline-block mb-6 border-2 border-dashed border-gray-300">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=CortexBandCheckoutDemo" alt="QR Code" class="mx-auto mix-blend-multiply">
            </div>
            
            <button id="close-modal-btn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-lg transition-colors">
                Cancel
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // Replace this with your actual Cloudflare Worker URL
        const API_URL = 'https://your-backend.your-domain.workers.dev/api/cart';
        
        // ==========================================
        // UI ELEMENTS
        // ==========================================
        const cartContainer = document.getElementById('cart-items');
        const totalContainer = document.getElementById('cart-total');
        const countContainer = document.getElementById('item-count');
        const checkoutBtn = document.getElementById('checkout-btn');
        const modal = document.getElementById('checkout-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // ==========================================
        // APP LOGIC
        // ==========================================
        async function fetchCart() {
            try {
                // Fetch LIVE REAL DATA from your Cloudflare Worker Instance
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const cartData = await response.json();
                
                renderCart(cartData);

            } catch (error) {
                console.error("Error fetching cart data:", error);
            }
        }

        function renderCart(cartData) {
            if (!cartData || !cartData.items || cartData.items.length === 0) {
                // Empty state
                cartContainer.innerHTML = `
                <div class="text-center text-gray-400 py-16 flex flex-col items-center">
                    <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <p class="text-lg font-medium">Your cart is empty</p>
                    <p class="text-sm mt-1">Scan an item with your band to add it.</p>
                </div>`;
                totalContainer.innerText = "$0.00";
                countContainer.innerText = "0 items";
                return;
            }

            let totalItems = 0;
            cartContainer.innerHTML = cartData.items.map(item => {
                totalItems += item.quantity;
                const itemTotal = (item.price * item.quantity).toFixed(2);
                
                return `
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-100 text-blue-600 font-bold w-8 h-8 rounded-full flex items-center justify-center text-sm">
                            x${item.quantity}
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                            <p class="text-sm text-gray-400">@ $${item.price.toFixed(2)} / ea</p>
                        </div>
                    </div>
                    <div class="font-black text-xl text-gray-700">
                        $${itemTotal}
                    </div>
                </div>
                `;
            }).join('');

            totalContainer.innerText = `$${cartData.total.toFixed(2)}`;
            countContainer.innerText = `${totalItems} items`;
        }

        // Poll for updates every 2 seconds
        setInterval(fetchCart, 2000);
        
        // Initial fetch on load
        fetchCart();

        // ==========================================
        // CHECKOUT MODAL LOGIC
        // ==========================================
        checkoutBtn.addEventListener('click', async () => {
            modal.classList.remove('hidden');
            
            // Clear the actual cart in the Cloudflare KV database
            try {
                await fetch(API_URL + '/clear', { method: 'POST' });
                // Instantly update UI to empty
                fetchCart();
            } catch (err) {
                console.error("Error clearing cart on checkout:", err);
            }
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });
    </script>
    
    <!-- Navigation Bar -->
    <div class="absolute bottom-0 w-full bg-white border-t flex justify-around p-3 text-sm text-gray-500 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <a href="index.html" class="flex flex-col items-center text-blue-600 font-bold transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            Cart
        </a>
        <a href="history.html" class="flex flex-col items-center hover:text-blue-600 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            Receipts
        </a>
        <a href="admin.html" class="flex flex-col items-center hover:text-blue-600 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Admin
        </a>
    </div>
</body>
</html>
