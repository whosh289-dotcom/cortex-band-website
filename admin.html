<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <div class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md z-10">
            <h1 class="text-xl font-bold tracking-wide">Store Admin</h1>
            <a href="index.html" class="bg-gray-700 px-3 py-1 rounded-md text-sm font-semibold hover:bg-gray-600 transition">Back to Cart</a>
        </div>

        <div class="flex-grow p-4 overflow-y-auto pb-24">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Inventory Management</h2>
            
            <!-- Add Product Form -->
            <div class="bg-gray-50 p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
                <h3 class="font-bold text-gray-700 mb-3">Add New Product</h3>
                <form id="add-product-form" class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600">Product Name</label>
                        <input type="text" id="prod-name" class="w-full border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Orange Juice" required>
                    </div>
                    <div class="flex gap-3">
                        <div class="w-1/2">
                            <label class="block text-sm text-gray-600">Price ($)</label>
                            <input type="number" step="0.01" id="prod-price" class="w-full border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="4.99" required>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm text-gray-600">Barcode</label>
                            <input type="text" id="prod-barcode" class="w-full border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Scan or type" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition-colors mt-2">
                        Save Product
                    </button>
                </form>
            </div>

            <!-- Product List -->
            <div>
                <h3 class="font-bold text-gray-700 mb-3">Current Catalog</h3>
                <div id="product-list" class="space-y-2">
                    <!-- Products will render here -->
                    <div class="p-3 bg-white border rounded-lg flex justify-between items-center text-sm">
                        <div>
                            <span class="font-bold">Organic Apple</span> <span class="text-gray-500">($1.99)</span><br>
                            <span class="text-xs text-gray-400">Code: 123456789</span>
                        </div>
                        <button class="text-red-500 hover:text-red-700 font-bold">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-white border-t flex justify-around p-3 text-sm text-gray-500">
            <a href="index.html" class="flex flex-col items-center hover:text-blue-600 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="admin.html" class="flex flex-col items-center text-blue-600 font-bold transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Admin
            </a>
        </div>
    </div>

    <script>
        // Note: To make this fully functional, we will add an /api/products route to your backend!
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Product saving will be linked to the backend API.");
        });
    </script>
</body>
</html>
