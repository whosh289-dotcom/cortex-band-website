<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex Band - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <!-- Responsive Container -->
    <div class="w-full md:max-w-3xl lg:max-w-5xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <!-- Header -->
        <div class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-md z-10">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">Store Admin</h1>
        </div>

        <div class="flex-grow p-4 md:p-8 overflow-y-auto pb-24">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 md:mb-6">Inventory Management</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10">
                <!-- Add Product Form -->
                <div class="bg-gray-50 p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                    <h3 class="font-bold text-gray-700 mb-4 text-lg">Add New Product</h3>
                    <form id="add-product-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Product Name</label>
                            <input type="text" id="prod-name" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Orange Juice" required>
                        </div>
                        <div class="flex gap-4">
                            <div class="w-1/2">
                                <label class="block text-sm font-medium text-gray-600 mb-1">Price ($)</label>
                                <input type="number" step="0.01" id="prod-price" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="4.99" required>
                            </div>
                            <div class="w-1/2">
                                <label class="block text-sm font-medium text-gray-600 mb-1">Barcode</label>
                                <input type="text" id="prod-barcode" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Scan or type" required>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors mt-2">
                            Save Product
                        </button>
                    </form>
                </div>

                <!-- Product List -->
                <div>
                    <h3 class="font-bold text-gray-700 mb-4 text-lg flex justify-between items-center">
                        Current Catalog
                        <button onclick="loadProducts()" class="text-blue-500 text-sm font-normal hover:underline">Refresh</button>
                    </h3>
                    <div id="product-list" class="space-y-3">
                        <div class="text-gray-500 text-sm text-center py-4">Loading products...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="absolute bottom-0 w-full bg-white border-t flex justify-around p-3 text-sm text-gray-500 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <a href="index.html" class="flex flex-col items-center hover:text-blue-600 transition">
                <svg class="w-6 h-6 mb-1 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Cart
            </a>
            <a href="history.html" class="flex flex-col items-center hover:text-blue-600 transition">
                <svg class="w-6 h-6 mb-1 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Receipts
            </a>
            <a href="admin.html" class="flex flex-col items-center text-blue-600 font-bold transition">
                <svg class="w-6 h-6 mb-1 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Admin
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'https://your-backend.your-domain.workers.dev/api';
        
        async function loadProducts() {
            try {
                const res = await fetch(API_URL + '/products');
                const products = await res.json();
                
                const list = document.getElementById('product-list');
                if(products.length === 0) {
                    list.innerHTML = '<div class="text-gray-400 text-center py-4">No products found. Add one!</div>';
                    return;
                }
                
                list.innerHTML = products.map(p => `
                    <div class="p-4 bg-white border rounded-xl flex justify-between items-center shadow-sm hover:shadow-md transition">
                        <div>
                            <span class="font-bold text-gray-800 text-lg">${p.name}</span> <span class="text-blue-600 font-semibold ml-2">$${p.price.toFixed(2)}</span><br>
                            <span class="text-sm text-gray-400 font-mono mt-1 block">Barcode: ${p.barcode}</span>
                        </div>
                        <button onclick="deleteProduct('${p.barcode}')" class="text-red-500 hover:text-white hover:bg-red-500 font-bold px-3 py-1 rounded transition border border-red-500">Delete</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('product-list').innerHTML = '<div class="text-red-500 text-sm">Failed to load API</div>';
            }
        }

        async function deleteProduct(barcode) {
            if(!confirm("Are you sure you want to delete this product?")) return;
            await fetch(API_URL + '/products', {
                method: 'DELETE',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ barcode })
            });
            loadProducts();
        }

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Saving...";
            
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const barcode = document.getElementById('prod-barcode').value;

            await fetch(API_URL + '/products', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, price, barcode })
            });

            e.target.reset();
            btn.innerText = "Save Product";
            loadProducts();
        });

        loadProducts();
    </script>
</body>
</html>
